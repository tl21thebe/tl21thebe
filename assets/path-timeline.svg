<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230" role="img" aria-label="Animated timeline: matric in 2021, Biological Sciences, Computer Science, expected graduation mid-2027">
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="230" rx="12" fill="#0d1117" stroke="#30363d"/>

  <!-- base track -->
  <line x1="100" y1="80" x2="700" y2="80" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>
  <!-- progress line that draws itself -->
  <line x1="100" y1="80" x2="700" y2="80" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="600" stroke-dashoffset="600">
    <animate attributeName="stroke-dashoffset" values="600;0;0;600" keyTimes="0;0.4;0.92;1" dur="9s" repeatCount="indefinite"/>
  </line>

  <!-- node 1 -->
  <g>
    <circle cx="100" cy="80" r="16" fill="#0d1117" stroke="#58a6ff" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.92;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <text x="100" y="85" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#58a6ff" opacity="0">1
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.92;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>
  <!-- node 2 -->
  <g>
    <circle cx="300" cy="80" r="16" fill="#0d1117" stroke="#6f8bff" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.14;0.17;0.92;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <text x="300" y="85" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#6f8bff" opacity="0">2
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.14;0.17;0.92;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>
  <!-- node 3 -->
  <g>
    <circle cx="500" cy="80" r="16" fill="#0d1117" stroke="#8c80fb" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.27;0.30;0.92;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <text x="500" y="85" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#8c80fb" opacity="0">3
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.27;0.30;0.92;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>
  <!-- node 4 with pulse -->
  <g>
    <circle cx="700" cy="80" r="16" fill="#0d1117" stroke="#a371f7" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.41;0.92;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="80" r="16" fill="none" stroke="#a371f7" stroke-width="2" opacity="0">
      <animate attributeName="r" values="16;30" dur="1.8s" begin="3.6s;5.4s;7.2s" fill="freeze"/>
      <animate attributeName="opacity" values="0.8;0" dur="1.8s" begin="3.6s;5.4s;7.2s" fill="freeze"/>
    </circle>
    <text x="700" y="85" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#a371f7" opacity="0">4
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.41;0.92;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- labels -->
  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.92;1" dur="9s" repeatCount="indefinite"/>
      <text x="100" y="130" font-size="16" font-weight="700" fill="#e6edf3">2021</text>
      <text x="100" y="152" font-size="12" fill="#8b949e">Matriculated with</text>
      <text x="100" y="168" font-size="12" fill="#8b949e">4 distinctions</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.16;0.20;0.92;1" dur="9s" repeatCount="indefinite"/>
      <text x="300" y="130" font-size="16" font-weight="700" fill="#e6edf3">Biological Sciences</text>
      <text x="300" y="152" font-size="12" fill="#8b949e">First year at university,</text>
      <text x="300" y="168" font-size="12" fill="#8b949e">a science foundation</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.29;0.33;0.92;1" dur="9s" repeatCount="indefinite"/>
      <text x="500" y="130" font-size="16" font-weight="700" fill="#e6edf3">Computer Science</text>
      <text x="500" y="152" font-size="12" fill="#8b949e">Software, systems</text>
      <text x="500" y="168" font-size="12" fill="#8b949e">and databases</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.40;0.44;0.92;1" dur="9s" repeatCount="indefinite"/>
      <text x="700" y="130" font-size="16" font-weight="700" fill="#e6edf3">Mid-2027</text>
      <text x="700" y="152" font-size="12" fill="#8b949e">Expected graduation,</text>
      <text x="700" y="168" font-size="12" fill="#8b949e">ready for a developer role</text>
    </g>
  </g>

  <text x="400" y="209" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" letter-spacing="2" fill="#484f58">MY PATH</text>
</svg>
